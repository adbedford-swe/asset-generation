[plugin]

name="Assetgen"
description="Imports assetgen assets (.glb + .assetgen) ready to use. Characters: looping clips, an AnimationTree with a locomotion blend, and an AssetgenCharacter script. Props and dioramas: a static body with their collision shape, and an AssetgenProp script. Scenes: a static body on the ground and on every placed object, and an AssetgenScene script."
author="assetgen"
version="0.7.0"
script="plugin.gd"
