[project]
name = "assetgen"
version = "0.6.0"
description = "Text or image -> 3D Gaussian splat -> textured mesh -> rigged, animated character, prop or set piece (glTF), on ROCm"
readme = "README.md"
# One interpreter for every stage: bpy 4.5 only ships cp311 wheels, and a single
# environment means one ROCm torch install (~15 GB) instead of one per stage.
requires-python = "==3.11.*"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "triton-rocm==3.8.0; sys_platform == 'linux'",
    "numpy>=1.26,<2",  # bpy 4.5 (cp311) is built against numpy 1.x
    "scipy>=1.14",
    "pillow>=11",
    "plyfile>=1.0",
    "scikit-image>=0.24",
    "trimesh>=4.5",
    "xatlas>=0.0.10",
    "fast-simplification>=0.1.9",
    "pygltflib>=1.16",
    "huggingface_hub>=0.34",
    "requests>=2.31",
    "tqdm>=4.66",
    # Stage 0: image -> Gaussians
    "idol",
    # Stage 2: SkinTokens / TokenRig
    "transformers>=5.0,<6",
    "diffusers>=0.40",
    "accelerate>=1.1",
    "python-box",
    "einops>=0.8",
    "omegaconf>=2.3",
    "lightning>=2.4",
    "addict",
    "open3d>=0.19,<0.20",  # 0.20 only ships glibc 2.35 wheels; 0.19 runs on glibc 2.31 and up
    "bottle",
    "tornado",
    "bpy==4.5.*",
    # Stage 3: UniMate
    "torch-geometric==2.7.0",
    "torchdiffeq==0.2.5",
    "sentencepiece>=0.2",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "num2words>=0.5.14",
    "openai>=1.60",
    "clip",
    "motion",
    "matplotlib>=3.9",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "tyro>=0.9",
    "rich>=13",
    "loguru>=0.7",
    # Web UI
    "gradio>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
assetgen = "assetgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assetgen"]

[tool.uv]
# The Motion package has a legacy setup.py that imports pkg_resources.
extra-build-dependencies = { motion = ["setuptools<81"] }
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]
triton-rocm = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }
torchvision = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]
idol = { git = "https://github.com/adbedford-swe/idol-sdk", rev = "9da8f73bdc6415663b0be6d435c28acc65e4bd1b" }
clip = { git = "https://github.com/openai/CLIP.git", rev = "d05afc436d78f1c48dc0dbf8e5980a9d471f35f6" }
motion = { git = "https://github.com/inbar-2344/Motion.git", rev = "ac236251f90e5ca37c444c53ad383fc85de6d833" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

# Windows/NVIDIA is only for development; the target is Linux + ROCm.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# The ROCm torch wheel is 6.2 GB and its index publishes no separate metadata file;
# declaring it here lets uv resolve the lock without downloading the wheel.
[[tool.uv.dependency-metadata]]
name = "torch"
version = "2.14.1+rocm7.2"
requires-python = ">=3.10"
requires-dist = [
    "filelock",
    "typing-extensions>=4.10.0",
    "setuptools>=77.0.3",
    "sympy>=1.13.3",
    "networkx>=2.5.1",
    "jinja2",
    "fsspec>=0.8.5",
    "triton-rocm~=3.8.0; platform_system == 'Linux' and python_version < '3.15'",
]
